name: Insight Service CI/CD

on:
  push:
    branches: [ "develop" ]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: pi-insight
  SERVICE_NAME: planit-insight-svc

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v3

    - name: 2. Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'corretto'

    - name: 3. Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew clean build -x test

    - name: 4. Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: 5. Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: 6. Build and push Docker image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: 7. Checkout Manifest Repository
      uses: actions/checkout@v3
      with:
        repository: barumi-acs/Planit-manifests # ◀── 매니페스트 레포 주소
        token: ${{ secrets.GH_PAT }}           # ◀── 미리 등록한 PAT (Personal Access Token)
        ref: develop                           # ◀── develop 브랜치 사용
        path: manifest-repo                    # ◀── 현재 작업 폴더 내 'manifest-repo' 폴더에 저장

    # 8. deployment.yaml 파일 내 이미지 태그 수정
    - name: 8. Update Image Tag in YAML
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: pi-insight                # ◀── Insight 서비스용 ECR 레포 명칭 확인!
        IMAGE_TAG: ${{ github.sha }}
      run: |
        TARGET_FILE="manifest-repo/insight-svc/deployment.yaml"
        FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

        sed -i "s|image: .*|image: $FULL_IMAGE|g" $TARGET_FILE

        cat $TARGET_FILE | grep "image:"

    # 9. 변경사항 커밋 및 푸시
    - name: 9. Push Changes to Manifest Repo
      run: |
        cd manifest-repo
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action Bot"
        
        git add .
        
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "chore(insight-svc): update image to ${{ github.sha }}"
          git push origin develop
        fi

    - name: Configure AWS credentials (for notify)
      if: always()
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

      # 🔥 실패 알림
    - name: 🔥 Notify CI Failure
      if: always() && failure()
      run: |
        aws sns publish \
          --region ${{ env.AWS_REGION }} \
          --topic-arn ${{ secrets.SNS_TOPIC_ARN }} \
          --message '{
            "type": "CI",
            "workflow": "${{ github.workflow }}",
            "service": "'$SERVICE_NAME'",
            "env": "dev",
            "stage": "pipeline",
            "status": "FAILED",
            "commit": "${{ github.event.head_commit.message }}",
            "author": "${{ github.actor }}",
            "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }'

      # 🚀 성공 알림
    - name: 🚀 Notify CI Success
      if: success()
      run: |
        aws sns publish \
          --region ${{ env.AWS_REGION }} \
          --topic-arn ${{ secrets.SNS_TOPIC_ARN }} \
          --message '{
            "type": "CI",
            "workflow": "${{ github.workflow }}",
            "service": "'$SERVICE_NAME'",
            "env": "dev",
            "stage": "pipeline",
            "status": "SUCCESS",
            "commit": "${{ github.event.head_commit.message }}",
            "author": "${{ github.actor }}",
            "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }'