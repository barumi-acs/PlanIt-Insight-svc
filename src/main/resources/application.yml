#[planit 글로벌 룰 - 환경 설정]
#포트, DB 등 환경 설정은 이 파일에서 관리됩니다.

server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: insight-core-service
  
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/planit_insight_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}

  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
  
  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 100

# Service B 연동 (InsightAI Python 서비스)
service-b:
  base-url: ${SERVICE_B_BASE_URL:http://localhost:8085}
  timeout: ${SERVICE_B_TIMEOUT:10000}

# gRPC 설정
grpc:
  # Insight Service 자신의 gRPC 서버 포트 (Schedule-svc에서 ActionLog 기록 시 호출)
  server:
    port: ${GRPC_SERVER_PORT:9092}
  
  # gRPC 클라이언트 설정 (InsightAI-svc Python 서버)
  # 단일 포트(50051)에서 Chatbot + Report 서비스 모두 제공
  client:
    # Chatbot 서비스 (기존)
    chat-service:
      address: ${GRPC_CHAT_SERVICE_ADDRESS:static://localhost:50051}
      negotiationType: plaintext
      enableKeepAlive: true
      keepAliveTime: 30s
      keepAliveTimeout: 10s
    
    # Report 서비스 (신규 - 동일 포트 사용)
    report-service:
      address: ${GRPC_REPORT_SERVICE_ADDRESS:static://localhost:50051}
      negotiationType: plaintext
      enableKeepAlive: true
      keepAliveTime: 30s
      keepAliveTimeout: 10s

# AWS DynamoDB (로컬)
aws:
  dynamodb:
    table-name: ${DYNAMODB_TABLE_NAME:ai_reports}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8001}

# ShedLock
shedlock:
  defaults:
    lock-at-most-for: 1h
    lock-at-least-for: 10m

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# /actuator/health 로 접속하면 서버 생존 여부 반환
management:
  endpoints:
    web:
      base-path: /api/v1/insight/actuator
      exposure:
        include: health, info, metrics
  metrics:
    tags:
      application: ${spring.application.name}


# CORS 설정 (Phase 2 JWT 대비)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}
